name: Refresh recruitment sources
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-jobs.yml'
permissions:
  contents: write
concurrency:
  group: recruitment-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collector
        run: python -m unittest discover -s tests -p test_collector.py
      - name: Refresh sources
        id: collect
        continue-on-error: true
        run: python scripts/collect_jobs.py
      - name: Publish refreshed data and failure markers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh recruitment sources'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Flag partial failures
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Some sources failed. Last good records and failure timestamps were retained.'
          exit 1
